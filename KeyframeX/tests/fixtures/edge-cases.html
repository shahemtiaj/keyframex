<!doctype html><html><head><meta charset="utf-8"><title>Edge cases</title>
<style>body{margin:0}#stage{position:relative;width:1920px;height:1080px;background:#111;overflow:hidden;font-family:sans-serif;color:#fff}
.a{position:absolute}</style>
<script src="assets/gsap.min.js"></script></head><body><div id="stage">
<h1 class="a" id="pop" style="left:100px;top:100px;font-size:90px;margin:0">Pop in from zero</h1>
<img class="a" id="nosrc" style="left:0;top:300px;width:100px;height:100px">
<img class="a" id="lazy" data-src="x.png" style="left:200px;top:300px;width:100px;height:100px">
<div class="a" id="zero" style="left:300px;top:300px;font-size:0">hidden text</div>
<div class="a" id="last" style="left:400px;top:400px;width:50px;height:50px;background:red;opacity:0"></div>
<div class="a" id="scale0" style="left:500px;top:500px;width:80px;height:80px;background:#0f0;transform:scale(0)">X</div>
<video class="a" id="novid" style="left:600px;top:600px;width:160px;height:90px"></video>
<svg class="a" width="200" height="200" style="left:900px;top:300px"><path d="" stroke="#fff"/><circle r="0" cx="5" cy="5" fill="red"/><text x="10" y="50" font-size="0">t</text></svg>
<div class="a" id="pct" style="left:100px;top:700px;font-size:60px">0</div>
<div class="a" id="wide" style="left:0;top:800px;width:0;height:0;border:4px solid #fff"></div>
<p class="a" style="left:100px;top:900px;font-size:40px">&nbsp;</p>
<div class="a" id="flip" style="left:1200px;top:500px;width:200px;height:120px;background:#36f">Flip</div>
<span class="a" id="emoji" style="left:1200px;top:800px;font-size:60px">🚀 Launch</span>
</div>
<script>
const DURATION=2;
gsap.from('#pop',{scale:0,duration:1,delay:0.5,ease:'back.out(2)'});
gsap.to('#last',{opacity:1,duration:0.01,delay:1.98});
gsap.to('#pct',{innerText:100,duration:1.5,snap:{innerText:1}});
gsap.fromTo('#flip',{scaleX:1},{scaleX:-1,duration:1});
gsap.to('#flip',{rotation:720,duration:2,ease:'none'});
</script></body></html>
