<!doctype html>
<html><head><meta charset="utf-8"><title>Promo patterns</title>
<!-- Patterns from a real promo page that converted wrongly in KeyframeX 1.2.0. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#111;overflow:hidden;width:100%;height:100%}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;transform-origin:0 0;font-family:Arial,sans-serif;color:#eee}
  .scene{position:absolute;inset:0;overflow:hidden}
  .orb{position:absolute;border-radius:50%}
  .w{display:inline-block}
  .acc{background:linear-gradient(100deg,#FF6B2C 0%,#FFA273 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #head{position:absolute;left:0;top:120px;width:1280px;text-align:center;font-weight:700;font-size:90px}
  #logo{position:absolute}
</style></head>
<body><div id="stage">
  <div class="scene" id="wipe">
    <div class="orb" id="glow" style="background:radial-gradient(circle,rgba(255,107,44,.5) 0%,rgba(255,107,44,0) 68%);left:340px;top:60px;width:600px;height:600px"></div>
    <div id="head"><span class="w" id="w1">Seen.</span> <span class="w acc" id="w2">Trusted.</span></div>
    <img id="logo" src="assets/photo.png">
    <div id="card" style="position:absolute;left:40px;top:540px;width:300px;font-size:44px;line-height:1.1;font-weight:700">Healthcare-focused<br>approach</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const P=(t,a,d)=>Math.min(1,Math.max(0,(t-a)/d));
function render(t){
  // circle wipe on the scene: closed at t=0, fully open from 0.5 s
  const e=P(t,0,0.5);$('wipe').style.clipPath=e>=1?'none':`circle(${(e*800).toFixed(1)}px at 640px 360px)`;
  // words come in from blur
  const b1=(1-P(t,0.2,0.6))*16;$('w1').style.filter=b1>0.1?`blur(${b1.toFixed(2)}px)`:'none';
  const b2=(1-P(t,0.4,0.6))*16;$('w2').style.filter=b2>0.1?`blur(${b2.toFixed(2)}px)`:'none';
  // the logo shrinks by changing its width (not a transform)
  const m=P(t,0.6,0.6);const w=400-300*m;const l=$('logo');l.style.width=w+'px';l.style.left=(640-w/2)+'px';l.style.top='420px';
}
const DURATION=1.5;
const t0=performance.now();
(function tick(){const t=Math.min(DURATION,(performance.now()-t0)/1000);render(t);if(t<DURATION)requestAnimationFrame(tick);})();
</script>
</body></html>
