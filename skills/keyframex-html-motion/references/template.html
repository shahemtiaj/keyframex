<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template — KeyframeX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Fixed-size stage = the After Effects comp. Scaled to fit the window for previewing only. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0d1020; font-family: Inter, sans-serif; }
  #title { position: absolute; left: 160px; top: 380px; margin: 0; font-size: 140px; font-weight: 800; color: #fff; letter-spacing: -2px; white-space: nowrap; }
  #title span { display: inline-block; }
  #sub { position: absolute; left: 164px; top: 560px; font-size: 44px; color: #9aa3c7; }
  #bar { position: absolute; left: 164px; top: 660px; width: 520px; height: 10px; border-radius: 5px; background: #7c5cff; transform-origin: 0 50%; }
  #count { position: absolute; right: 160px; bottom: 140px; font-size: 96px; font-weight: 700; color: #7c5cff; }
</style>
</head>
<body>
<div id="stage">
  <h1 id="title">Make it move</h1>
  <div id="sub">Editable in After Effects</div>
  <div id="bar"></div>
  <div id="count">0%</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
  const DURATION = 6;   // seconds — KeyframeX reads this
  const FPS = 30;       // optional

  // Preview scaling (KeyframeX measures the stage's real 1920×1080 size).
  const stage = document.getElementById('stage');
  function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k}) translate(-50%, -50%)`; }
  addEventListener('resize', fit); fit();

  // Split the title into letters: each letter becomes its own text layer.
  const title = document.getElementById('title');
  title.innerHTML = [...title.textContent].map((c) => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('');

  const tl = gsap.timeline();
  tl.from('#title span', { y: 80, opacity: 0, duration: 0.7, stagger: 0.04, ease: 'power3.out' })
    .from('#sub', { x: -40, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.6)
    .from('#bar', { scaleX: 0, duration: 0.9, ease: 'expo.inOut' }, 0.9)
    .to({ v: 0 }, { v: 100, duration: 2.5, ease: 'power2.out', onUpdate() { document.getElementById('count').textContent = Math.round(this.targets()[0].v) + '%'; } }, 1.2)
    .to('#title', { opacity: 0, y: -30, duration: 0.5, ease: 'power2.in' }, DURATION - 0.6);
</script>
</body>
</html>
